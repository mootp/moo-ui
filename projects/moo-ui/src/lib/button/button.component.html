<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="btnClass()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <svg
      class="moo-btn__spinner"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle class="moo-btn__spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
      <path class="moo-btn__spinner-arc" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
    </svg>
  }
  <ng-content />
</button>
