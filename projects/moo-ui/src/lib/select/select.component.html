<div class="moo-select-field" [class.is-disabled]="disabled() || isDisabled()">
  @if (label()) {
    <label class="moo-select-field__label" [class.is-required]="required()" [attr.for]="resolvedInputId()">
      {{ label() }}
    </label>
  }

  <div class="moo-select-field__control">
    <select
      [id]="resolvedInputId()"
      [class]="selectClass()"
      [disabled]="disabled() || isDisabled()"
      [required]="required()"
      [value]="value()"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-readonly]="readonly() || null"
      (change)="onValueChange($event)"
      (blur)="markTouched()"
      (mousedown)="preventReadonlyInteraction($event)"
      (keydown)="preventReadonlyInteraction($event)"
    >
      @if (placeholder()) {
        <option value="" [disabled]="required()">{{ placeholder() }}</option>
      }

      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</option>
      }
    </select>

    <span class="moo-select-field__icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 011.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
      </svg>
    </span>
  </div>

  @if (error()) {
    <p class="moo-select-field__message moo-select-field__message--error" [id]="errorId" role="alert">{{ error() }}</p>
  } @else if (hint()) {
    <p class="moo-select-field__message moo-select-field__message--hint" [id]="hintId">{{ hint() }}</p>
  }
</div>
