<div
  [class]="wrapperClass()"
  role="radiogroup"
  [attr.aria-labelledby]="label() ? labelId : null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="!!error()"
>
  @if (label()) {
    <span class="moo-radio-group__label" [class.is-required]="required()" [id]="labelId">{{ label() }}</span>
  }

  <div class="moo-radio-group__options">
    @for (option of options(); track option.value) {
      <label class="moo-radio" [class.is-disabled]="isOptionDisabled(option)">
        <span class="moo-radio__control-shell">
          <input
            class="moo-radio__native"
            type="radio"
            [name]="resolvedName()"
            [value]="option.value"
            [checked]="value() === option.value"
            [disabled]="isOptionDisabled(option)"
            [required]="required()"
            [attr.aria-readonly]="readonly() || null"
            (change)="onSelectionChange(option.value)"
            (blur)="markTouched()"
          />
          <span class="moo-radio__control" aria-hidden="true"></span>
        </span>

        <span class="moo-radio__content">
          <span class="moo-radio__text">{{ option.label }}</span>
          @if (option.hint) {
            <span class="moo-radio__option-hint">{{ option.hint }}</span>
          }
        </span>
      </label>
    }
  </div>

  @if (error()) {
    <p class="moo-radio-group__message moo-radio-group__message--error" [id]="errorId" role="alert">{{ error() }}</p>
  } @else if (hint()) {
    <p class="moo-radio-group__message moo-radio-group__message--hint" [id]="hintId">{{ hint() }}</p>
  }
</div>
